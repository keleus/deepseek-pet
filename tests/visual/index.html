<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Harness plugin visual fixture</title>
  <style>
    :root { --dsw-alias-bg-l1:#101a2c; --dsw-alias-border-l2:#33445f; --dsw-alias-text-primary:#f2f6fc; --dsw-alias-text-secondary:#aebbd0; --dsw-alias-text-tertiary:#71819b; font-family:Inter,system-ui,sans-serif; color:#dbe5f5; }
    * { box-sizing:border-box; } body { margin:0; overflow:hidden; background:#0b1220; }
    .app { display:grid; grid-template-columns:240px 1fr; height:100vh; background:linear-gradient(145deg,#0e182a,#111d31); }
    aside { padding:24px 16px; border-right:1px solid #263650; }
    .logo { font-weight:800; color:#f4f8ff; } .logo small { display:block; margin-top:3px; color:#71819b; font-size:8px; letter-spacing:.16em; }
    nav { margin-top:30px; } nav div { margin:7px 0; padding:10px 12px; border-radius:10px; color:#8494af; font-size:12px; } nav div.active { background:#1b2b47; color:#e8f1ff; }
    main { position:relative; display:grid; grid-template-rows:64px 1fr 100px; min-width:0; }
    header { display:flex; align-items:center; justify-content:space-between; padding:0 26px; border-bottom:1px solid #263650; }
    header b { font-size:13px; } header span { color:#71819b; font-size:11px; }
    .chat { padding:34px max(30px,10vw); overflow:hidden; }
    .message { max-width:620px; margin:0 auto 18px; padding:15px 18px; border:1px solid #283a57; border-radius:14px; background:#121f35; color:#aebbd0; font-size:13px; line-height:1.6; }
    .message.user { width:max-content; margin-right:max(0px,calc((100% - 620px)/2)); border-color:#31568b; background:#19365d; color:#e4efff; }
    .composer { margin:0 max(30px,10vw) 20px; border:1px solid #304361; border-radius:16px; background:#111e33; }
    #overlay { position:absolute; inset:0; z-index:20; pointer-events:none; }
    #states { position:fixed; left:255px; bottom:16px; z-index:40; display:flex; gap:5px; }
    #states button { padding:6px 9px; border:1px solid #395274; border-radius:8px; background:#162640; color:#aebbd0; cursor:pointer; }
  </style>
</head>
<body>
  <div class="app">
    <aside><div class="logo">DeepSeek Harness<small>AGENT WORKSPACE</small></div><nav><div class="active">修复登录页错误</div><div>代码审查</div><div>新任务</div></nav></aside>
    <main><header><b>修复登录页错误</b><span>deepseek-v4-flash</span></header><section class="chat"><div class="message user">请修复登录页面偶发的 token 失效问题。</div><div class="message">我会先检查鉴权状态的刷新路径和失败重试逻辑。</div></section><div class="composer"></div><div id="overlay"></div></main>
  </div>
  <div id="states"><button data-state="idle">待机</button><button data-state="thinking">思考</button><button data-state="working">工具</button><button data-state="speaking">回答</button><button data-state="approval">授权</button><button data-state="image">图片</button><button data-state="full">吃饱</button><button data-state="success">完成</button><button data-state="error">错误</button></div>
  <script src="./fixture.bundle.js"></script>
</body>
</html>
